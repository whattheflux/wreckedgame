<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Wrecked</title>
    <link rel="icon" href="data:," />
    <style>
      html, body { margin: 0; height: 100%; background: #0b1117; color: #d7e0e8; font-family: system-ui, sans-serif; }
      #app { display: flex; height: 100%; }
      #stage { flex: 1; min-width: 0; position: relative; display: flex; flex-direction: column; }
      #viewport { flex: 1; min-height: 0; position: relative; }
      canvas { display: block; width: 100%; height: 100%; }
      canvas[hidden] { display: none; }
      #world { cursor: crosshair; }
      #camctl { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; z-index: 2; }
      #camctl[hidden] { display: none; }
      #camctl button { width: 32px; height: 32px; padding: 0; font-size: 16px; line-height: 1; background: rgba(16, 26, 35, 0.85); }
      #roster { width: 132px; display: flex; flex-direction: column; gap: 8px; padding: 10px 8px; overflow-y: auto; border-right: 1px solid #22303c; background: #0e161e; }
      #roster[hidden] { display: none; }
      #roster .rc { position: relative; display: flex; flex-direction: column; align-items: center; gap: 3px; padding: 6px 6px 7px; border: 2px solid #22303c; border-radius: 6px; background: #14202b; color: #d7e0e8; cursor: pointer; font-size: 12px; text-align: center; }
      #roster .rc:hover { background: #1a2a38; }
      #roster .rc.sel { border-color: #e8b04a; background: #2a2616; box-shadow: 0 0 0 2px rgba(232, 176, 74, 0.35), 0 0 14px rgba(232, 176, 74, 0.45); }
      #roster .rc.sel::before { content: ''; position: absolute; left: -8px; top: 50%; margin-top: -6px; border: 6px solid transparent; border-left-color: #e8b04a; border-right: 0; }
      #roster .rc.spent { opacity: 0.6; }
      #roster .rc.down { border-color: #7a2c2c; background: #2a1a1a; }
      #roster .face { width: 64px; height: 64px; border-radius: 4px; overflow: hidden; background: #0b1117; position: relative; }
      #roster .face img { position: absolute; left: 50%; top: 0; width: 100%; transform: translateX(-50%) scale(1.7); transform-origin: 50% 8%; image-rendering: auto; }
      #roster .face .ph { display: flex; align-items: center; justify-content: center; height: 100%; font-size: 24px; opacity: 0.6; }
      #roster .nm { font-weight: 600; line-height: 1.15; word-break: break-word; }
      #roster .key { position: absolute; top: 3px; left: 5px; font-size: 10px; opacity: 0.55; }
      #roster .bar { width: 100%; height: 5px; background: #0b1117; border-radius: 3px; overflow: hidden; }
      #roster .bar i { display: block; height: 100%; background: #5fbf6a; }
      #roster .bar i.low { background: #e0674e; }
      #roster .pips { display: flex; gap: 3px; height: 7px; }
      #roster .pips b { width: 9px; height: 7px; border-radius: 2px; background: #2f4352; }
      #roster .pips b.on { background: #7ec4e8; }
      #roster .tag { font-size: 10px; font-weight: 700; color: #e0674e; letter-spacing: 0.06em; }
      #bar { display: grid; grid-template-columns: minmax(150px, 1fr) auto minmax(150px, 1fr); align-items: center; gap: 16px; padding: 8px 14px; min-height: 96px; box-sizing: border-box; border-top: 1px solid #22303c; background: #0e161e; }
      #bar[hidden] { display: none; }
      #hands { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-width: 0; }
      #hands .slots { display: flex; gap: 6px; }
      #hands .slot { width: 62px; height: 62px; padding: 4px; box-sizing: border-box; border: 2px solid #2f4352; border-radius: 8px; background: #14202b; }
      #hands .slot.ghost { opacity: 0.38; border-style: dashed; }
      #hands .slot.bare { opacity: 0.85; }
      #hands .wname { display: flex; gap: 6px; align-items: baseline; font-size: 12px; line-height: 1.25; white-space: nowrap; }
      #hands .wname span { opacity: 0.6; font-size: 11px; }
      #barbtns { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
      .abtn { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; min-width: 84px; height: 62px; padding: 4px 10px; border-radius: 8px; background: #1c2b38; border: 1px solid #2f4352; font-size: 13px; font-weight: 600; color: #d7e0e8; }
      .abtn kbd { font: 600 10px/1 system-ui, sans-serif; opacity: 0.55; border: 1px solid #3a5266; border-radius: 3px; padding: 2px 4px; }
      .abtn.main { min-width: 104px; }
      .abtn.skill { background: #17242f; }
      .abtn:hover:not(.off) { background: #26394a; }
      .abtn.active { border-color: #e8b04a; color: #e8b04a; box-shadow: 0 0 0 1px rgba(232, 176, 74, 0.35); }
      .abtn.off { opacity: 0.4; cursor: default; }
      #tip { position: absolute; z-index: 5; width: 270px; padding: 8px 10px; border: 1px solid #3a5266; border-radius: 6px; background: rgba(10, 16, 22, 0.97); font-size: 12px; line-height: 1.4; pointer-events: none; transform: translateX(-50%); }
      #tip[hidden] { display: none; }
      #tip b { font-size: 13px; }
      #tip .cost { color: #e8b04a; font-weight: 700; margin: 1px 0 4px; }
      #tip p { margin: 3px 0 0; opacity: 0.85; }
      #side { width: 300px; display: flex; flex-direction: column; border-left: 1px solid #22303c; background: #101a23; }
      #panel { padding: 12px; border-bottom: 1px solid #22303c; font-size: 13px; line-height: 1.5; }
      #panel h2 { margin: 0 0 6px; font-size: 14px; }
      #actions { display: flex; flex-wrap: wrap; gap: 6px; padding: 10px 12px; border-bottom: 1px solid #22303c; }
      button { background: #1c2b38; color: #d7e0e8; border: 1px solid #2f4352; border-radius: 4px; padding: 6px 10px; cursor: pointer; font-size: 12px; }
      button:hover:not(:disabled) { background: #26394a; }
      button.active { border-color: #e8b04a; color: #e8b04a; }
      button:disabled { opacity: 0.4; cursor: default; }
      #log { flex: 1; overflow-y: auto; padding: 10px 12px; font-size: 12px; line-height: 1.45; }
      #log div { margin-bottom: 3px; }
      #log .enemy { color: #e07a6b; }
      #log .player { color: #7ec4e8; }
      #log .sys { color: #8a9aa8; }
      #overlay { position: absolute; inset: 0; display: flex; align-items: flex-start; justify-content: center; overflow-y: auto; background: rgba(8, 13, 18, 0.92); padding: 24px 16px; box-sizing: border-box; }
      #overlay[hidden] { display: none; }
      #overlay .card { width: 100%; max-width: 640px; margin: auto 0; }
      #overlay h1 { margin: 0 0 4px; font-size: 24px; }
      #overlay h3 { margin: 16px 0 6px; font-size: 13px; text-transform: uppercase; letter-spacing: 0.06em; opacity: 0.7; }
      #overlay .sub { margin: 0 0 14px; opacity: 0.75; font-size: 14px; }
      #overlay .field { display: block; font-size: 13px; margin-bottom: 4px; }
      #overlay input { background: #0e1720; color: #d7e0e8; border: 1px solid #2f4352; border-radius: 4px; padding: 6px 8px; font-size: 14px; margin-left: 6px; }
      #overlay .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 8px; }
      #overlay .choice { text-align: left; display: flex; flex-direction: column; gap: 3px; padding: 8px 10px; font-size: 12px; }
      #overlay .choice b { font-size: 13px; }
      #overlay .choice span { opacity: 0.75; }
      #overlay .choice.selected { border-color: #e8b04a; background: #2a2a1e; }
      #overlay .grid.looks { grid-template-columns: repeat(auto-fill, minmax(96px, 120px)); }
      #overlay .choice.look { align-items: center; text-align: center; }
      #overlay .choice.look img { image-rendering: auto; }
      #overlay .bad { color: #e0674e; opacity: 1 !important; }
      #overlay .preview { margin-top: 14px; padding: 8px 10px; border-left: 3px solid #7ec4e8; background: #1a2530; font-size: 13px; line-height: 1.5; }
      #overlay .row { display: flex; gap: 8px; margin-top: 16px; }
      #overlay .card:has(.inv) { max-width: 920px; }
      #overlay .tabs { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 8px; }
      #overlay .tab.on { border-color: #e8b04a; background: #2a2a1e; }
      #overlay .inv { display: grid; grid-template-columns: minmax(300px, 1fr) minmax(220px, 1fr); gap: 18px; align-items: start; }
      @media (max-width: 720px) { #overlay .inv { grid-template-columns: 1fr; } }
      #overlay h3 small { text-transform: none; letter-spacing: 0; opacity: 0.7; font-size: 12px; margin-left: 6px; }
      #overlay .doll { position: relative; display: grid; grid-template-columns: repeat(3, 72px); grid-template-rows: repeat(4, 72px); gap: 6px; justify-content: center; padding: 8px; background: #101a23; border: 1px solid #2a3b4a; border-radius: 8px; }
      #overlay .doll > div { position: relative; z-index: 1; }
      #overlay .dollimg { position: absolute; left: 50%; top: 50%; height: 92%; transform: translate(-50%, -50%); opacity: 0.55; pointer-events: none; image-rendering: auto; z-index: 0; }
      #overlay .igrid { display: grid; grid-template-columns: repeat(auto-fill, 72px); gap: 6px; }
      #overlay .islot { position: relative; width: 72px; height: 72px; padding: 8px; display: flex; align-items: center; justify-content: center; background: rgba(14, 23, 32, 0.85); border: 1px dashed #3a5062; border-radius: 6px; }
      #overlay .islot.full { border-style: solid; border-color: #4a6478; background: #16222d; }
      #overlay .islot.sel { border-color: #e8b04a; box-shadow: 0 0 0 2px rgba(232, 176, 74, 0.45); }
      #overlay .islot i { position: absolute; left: 2px; right: 2px; bottom: 1px; font-size: 9px; font-style: normal; text-align: center; opacity: 0.65; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; pointer-events: none; }
      #overlay .islot svg { width: 100%; height: 100%; margin-bottom: 8px; }
      #overlay .ghosthand { display: block; width: 100%; height: 100%; opacity: 0.25; margin-bottom: 8px; }
      #overlay .islot.full .ghosthand { opacity: 1; }
      #overlay .idrop { min-height: 96px; padding: 8px; border: 1px dashed #3a5062; border-radius: 8px; background: rgba(16, 26, 35, 0.6); }
      #overlay .idrop .hint { margin: 8px 0 0; font-size: 11px; opacity: 0.45; }
      #overlay .body { margin: 0 0 6px; font-size: 13px; color: #e0674e; }
      #overlay .invmsg { min-height: 18px; margin: 10px 0 0; font-size: 13px; color: #e8b04a; }
      #overlay .prisoner { display: flex; gap: 10px; align-items: center; padding: 6px 8px; margin-bottom: 6px; background: #101a23; border: 1px solid #2a3b4a; border-radius: 6px; }
      #overlay .prisoner img { height: 64px; opacity: 0.9; }
      #overlay .prisoner small { opacity: 0.7; margin-left: 4px; }
      #overlay .seg { display: flex; gap: 4px; margin-top: 6px; }
      #overlay .seg button.on { border-color: #e8b04a; background: #2a2a1e; }
      #overlay .seg button.grim.on { border-color: #e0674e; background: #2a1a1a; }
      #overlay .camp { display: grid; gap: 6px; }
      #overlay .crow { display: grid; grid-template-columns: minmax(140px, 1.2fr) 80px minmax(160px, 2fr) 70px; gap: 8px; align-items: center; padding: 6px 8px; background: #101a23; border: 1px solid #2a3b4a; border-radius: 6px; font-size: 13px; }
      @media (max-width: 720px) { #overlay .crow { grid-template-columns: 1fr 1fr; } }
      #overlay .crow small, #overlay .prow small { opacity: 0.65; }
      #overlay .hp.hurt { color: #e8b04a; }
      #overlay .ok { opacity: 0.5; font-size: 12px; }
      #overlay .inj { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 2px; }
      #overlay .injrow { display: inline-flex; align-items: center; gap: 4px; }
      #overlay .chip { font-size: 11px; padding: 1px 6px; border-radius: 10px; border: 1px solid #5c7080; background: #1a2530; }
      #overlay .chip.serious { border-color: #e8b04a; color: #e8b04a; }
      #overlay .chip.permanent { border-color: #e0674e; color: #e0674e; }
      #overlay button.mini { font-size: 11px; padding: 2px 7px; }
      #overlay button.mini.grim { border-color: #6b3a34; }
      #overlay .prow { display: flex; justify-content: space-between; gap: 10px; flex-wrap: wrap; align-items: center; padding: 6px 8px; margin-bottom: 6px; background: #101a23; border: 1px solid #2a3b4a; border-radius: 6px; font-size: 13px; }
      #overlay .prow .seg { flex-wrap: wrap; margin: 0; }
      #overlay .def { font-size: 11px; opacity: 0.7; margin-left: 6px; }
      #overlay select { background: #0e1720; color: #d7e0e8; border: 1px solid #2f4352; border-radius: 4px; padding: 2px 6px; }
      #overlay .card:has(.camp) { max-width: 860px; }
      #overlay button.primary { background: #2b5a3a; border-color: #4a8a5c; font-size: 14px; padding: 8px 16px; }
    </style>
  </head>
  <body>
    <div id="app">
      <div id="roster" hidden></div>
      <div id="stage"><div id="viewport"><canvas id="board" hidden></canvas><canvas id="world"></canvas><div id="camctl" hidden><button data-cam="ccw" title="Rotate view left ([)">&#x27F2;</button><button data-cam="cw" title="Rotate view right (])">&#x27F3;</button><button data-cam="out" title="Zoom out (- or wheel)">&minus;</button><button data-cam="in" title="Zoom in (+ or wheel)">+</button><button data-cam="fit" title="Whole map / follow (Z)">&#x2922;</button></div></div><div id="bar" hidden><div id="hands"></div><div id="barbtns"></div><div></div></div><div id="tip" hidden></div><div id="overlay" hidden></div></div>
      <div id="side">
        <div id="panel"></div>
        <div id="actions"></div>
        <div id="log"></div>
      </div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
